<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tounes Check - Hors ligne</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #E71F1F 0%, #f8fafc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #E71F1F;
      font-size: 2em;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      line-height: 1.6;
    }
    .icon {
      font-size: 4em;
      margin-bottom: 20px;
    }
    button {
      background: #E71F1F;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1em;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background: #c91a1a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Tu es hors ligne</h1>
    <p>Vérifie ta connexion internet. Les fonctionnalités de Tounes Check nécessitent une connexion pour fonctionner.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
